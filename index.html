<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fiction Tribe — Mission Control</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ── Fiction Tribe tokens ─────────────────────────────────────────── */
  :root {
    --ft-purple: #4C00FF;          /* brand core */
    --ft-purple-soft: #7C4DFF;
    --mark: #8E6BF5;               /* validated chart mark on dark surface */
    --good: #1FA97E;  --good-text: #43D9A6;
    --warn: #C9832E;  --warn-text: #F0A951;
    --crit: #EF5069;  --crit-text: #FF8095;

    --bg: #0A0714;
    --surface: #120D1F;
    --surface-2: #1A1230;
    --line: rgba(142, 107, 245, 0.14);
    --line-strong: rgba(142, 107, 245, 0.30);

    --ink: #F2EFFA;
    --ink-2: #B4ABD1;
    --muted: #746C96;

    --radius: 14px;
    --font: "Gilroy", "Poppins", "Segoe UI", system-ui, -apple-system, sans-serif;
    --mono: "JetBrains Mono", "SF Mono", Consolas, monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    font-size: 14px;
    line-height: 1.5;
    min-height: 100vh;
    /* FT grid */
    background-image:
      linear-gradient(rgba(142,107,245,0.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(142,107,245,0.045) 1px, transparent 1px);
    background-size: 48px 48px;
  }

  .wrap { max-width: 1560px; margin: 0 auto; padding: 28px 32px 48px; }

  /* ── Header ───────────────────────────────────────────────────────── */
  header {
    display: flex; align-items: center; gap: 20px; flex-wrap: wrap;
    padding-bottom: 22px; margin-bottom: 26px;
    border-bottom: 1px solid var(--line-strong);
  }
  .logo {
    width: 44px; height: 44px; border-radius: 10px; flex: none;
    background: linear-gradient(135deg, var(--ft-purple) 0%, var(--ft-purple-soft) 100%);
    display: grid; place-items: center;
    font-weight: 800; font-size: 19px; letter-spacing: -0.5px; color: #fff;
    box-shadow: 0 0 32px rgba(76, 0, 255, 0.45);
  }
  .masthead h1 {
    font-size: 21px; font-weight: 800; letter-spacing: 0.16em; text-transform: uppercase;
  }
  .masthead .sub {
    font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted);
  }
  .head-meta { margin-left: auto; text-align: right; }
  .head-meta .date { font-size: 15px; font-weight: 600; }
  .head-meta .gen { font-size: 11px; color: var(--muted); font-family: var(--mono); }
  .sources-pill {
    display: inline-flex; align-items: center; gap: 7px;
    border: 1px solid var(--line-strong); border-radius: 999px;
    padding: 5px 13px; font-size: 11.5px; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--ink-2); background: var(--surface);
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; flex: none; }
  .dot.on  { background: var(--good-text); box-shadow: 0 0 8px rgba(67,217,166,0.7); }
  .dot.off { background: var(--muted); }

  /* ── Grid & panels ────────────────────────────────────────────────── */
  .grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 16px; }
  .panel {
    grid-column: span 4;
    background: linear-gradient(180deg, var(--surface-2) 0%, var(--surface) 100%);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 18px 20px;
    display: flex; flex-direction: column;
    min-height: 180px;
  }
  .panel.span-12 { grid-column: span 12; }
  .panel.span-8  { grid-column: span 8; }
  .panel.span-6  { grid-column: span 6; }
  .panel.span-4  { grid-column: span 4; }
  .panel.span-3  { grid-column: span 3; }
  @media (max-width: 1200px) { .panel, .panel.span-3, .panel.span-4, .panel.span-6, .panel.span-8 { grid-column: span 6; } .panel.span-12 { grid-column: span 12; } }
  @media (max-width: 760px)  { .panel, .panel.span-3, .panel.span-4, .panel.span-6, .panel.span-8, .panel.span-12 { grid-column: span 12; } }

  .panel-head {
    display: flex; align-items: baseline; gap: 10px;
    padding-bottom: 12px; margin-bottom: 14px;
    border-bottom: 1px solid var(--line);
  }
  .panel-head h2 {
    font-size: 12.5px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase;
  }
  .panel-head .src {
    font-family: var(--mono); font-size: 10.5px; color: var(--muted);
  }
  .panel-head .status { margin-left: auto; display: flex; align-items: center; gap: 6px;
    font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; }
  .status.on  { color: var(--good-text); }
  .status.off { color: var(--muted); }

  .offline-body {
    flex: 1; display: grid; place-items: center; text-align: center; padding: 18px 8px;
  }
  .offline-body .big { font-size: 13px; letter-spacing: 0.2em; color: var(--muted); font-weight: 700; }
  .offline-body .why { font-size: 12px; color: var(--muted); margin-top: 8px; max-width: 340px; }

  /* ── Briefing ─────────────────────────────────────────────────────── */
  .brief-headline { font-size: 22px; font-weight: 800; line-height: 1.25; margin-bottom: 6px; }
  .brief-summary  { color: var(--ink-2); max-width: 980px; margin-bottom: 18px; }
  .actions { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 12px; }
  .action {
    border: 1px solid var(--line); border-left: 3px solid var(--mark);
    border-radius: 10px; padding: 13px 15px; background: rgba(76,0,255,0.05);
  }
  .action.p1 { border-left-color: var(--crit); }
  .action.p2 { border-left-color: var(--warn); }
  .action-top { display: flex; align-items: center; gap: 9px; margin-bottom: 5px; }
  .pnum {
    font-family: var(--mono); font-size: 10.5px; font-weight: 600; flex: none;
    border-radius: 5px; padding: 2px 7px; letter-spacing: 0.06em;
    background: var(--surface-2); border: 1px solid var(--line-strong); color: var(--ink-2);
  }
  .action.p1 .pnum { color: var(--crit-text); border-color: rgba(239,80,105,0.4); }
  .action.p2 .pnum { color: var(--warn-text); border-color: rgba(201,131,46,0.4); }
  .action-title { font-weight: 700; font-size: 14.5px; }
  .action-why { color: var(--ink-2); font-size: 13px; margin-bottom: 9px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.05em;
    color: var(--ft-purple-soft); background: rgba(76,0,255,0.12);
    border: 1px solid rgba(124,77,255,0.35); border-radius: 999px; padding: 2px 9px;
  }
  .watchlist { margin-top: 16px; padding-top: 13px; border-top: 1px dashed var(--line); }
  .watchlist .wl-label { font-size: 10.5px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); margin-bottom: 7px; }
  .watchlist li { color: var(--ink-2); font-size: 13px; margin: 4px 0 4px 18px; }

  /* ── Shared list rows ─────────────────────────────────────────────── */
  .rows { display: flex; flex-direction: column; }
  .row {
    display: flex; gap: 12px; align-items: baseline;
    padding: 8px 2px; border-bottom: 1px solid rgba(142,107,245,0.07);
  }
  .row:last-child { border-bottom: none; }
  .row .when { font-family: var(--mono); font-size: 11px; color: var(--mark); flex: none; width: 86px; }
  .row .main { flex: 1; min-width: 0; }
  .row .t { font-weight: 600; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .d { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .d.wrap { white-space: normal; }
  .row .end { flex: none; font-family: var(--mono); font-size: 11.5px; color: var(--ink-2); }
  .flag {
    flex: none; font-size: 9.5px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
    border-radius: 4px; padding: 2px 6px; align-self: center;
  }
  .flag.act  { color: var(--crit-text); background: rgba(239,80,105,0.13); border: 1px solid rgba(239,80,105,0.35); }
  .flag.info { color: var(--ink-2); background: var(--surface-2); border: 1px solid var(--line); }

  .day-label { font-size: 10.5px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); margin: 10px 0 3px; }
  .day-label:first-child { margin-top: 0; }

  /* ── KPI tiles ────────────────────────────────────────────────────── */
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin-bottom: 14px; }
  .kpi { border: 1px solid var(--line); border-radius: 10px; padding: 10px 13px; background: rgba(18,13,31,0.6); }
  .kpi .v { font-size: 21px; font-weight: 800; letter-spacing: -0.02em; }
  .kpi .v.good { color: var(--good-text); } .kpi .v.warn { color: var(--warn-text); } .kpi .v.crit { color: var(--crit-text); }
  .kpi .k { font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); margin-top: 2px; }

  /* ── Bars (charts) ────────────────────────────────────────────────── */
  .bar-row { display: grid; grid-template-columns: 92px 1fr 76px; gap: 10px; align-items: center; padding: 5px 0; }
  .bar-row .bl { font-size: 11.5px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar-track { height: 10px; background: rgba(142,107,245,0.08); border-radius: 5px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 0 5px 5px 0; background: var(--mark); min-width: 2px; }
  .bar-fill.warn { background: var(--warn); } .bar-fill.crit { background: var(--crit); } .bar-fill.good { background: var(--good); }
  .bar-row .bv { font-family: var(--mono); font-size: 11px; color: var(--ink-2); text-align: right; }

  /* ── Footer status strip ──────────────────────────────────────────── */
  .status-strip {
    margin-top: 22px; padding: 14px 18px;
    border: 1px solid var(--line); border-radius: var(--radius);
    background: var(--surface);
    display: flex; flex-wrap: wrap; gap: 10px 22px; align-items: center;
  }
  .status-item { display: flex; align-items: center; gap: 7px; font-family: var(--mono); font-size: 11px; color: var(--ink-2); }
  .status-item .fetched { color: var(--muted); }
  .strip-label { font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted); margin-right: 4px; }

  .fatal {
    margin: 60px auto; max-width: 560px; text-align: center;
    border: 1px solid var(--line-strong); border-radius: var(--radius);
    background: var(--surface); padding: 44px 36px;
  }
  .fatal h2 { letter-spacing: 0.2em; margin-bottom: 12px; }
  .fatal p { color: var(--ink-2); }
  .fatal code { font-family: var(--mono); color: var(--ft-purple-soft); font-size: 12.5px; }

  a { color: var(--ft-purple-soft); text-decoration: none; }
  a:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">FT</div>
    <div class="masthead">
      <h1>Mission Control</h1>
      <div class="sub">Fiction Tribe &middot; CEO Action Board</div>
    </div>
    <div class="head-meta">
      <div class="date" id="hdr-date"></div>
      <div class="gen" id="hdr-gen"></div>
    </div>
    <div class="sources-pill" id="hdr-sources"><span class="dot on"></span><span>—</span></div>
  </header>

  <main class="grid" id="board"></main>

  <footer class="status-strip" id="status-strip"></footer>
</div>

<script src="data/dashboard-data.js"></script>
<script>
'use strict';
(function () {
  // ── helpers ─────────────────────────────────────────────────────────
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const num = (v) => (typeof v === 'number' && isFinite(v)) ? v : null;
  const arr = (v) => Array.isArray(v) ? v : [];
  const money = (v) => {
    const n = num(v); if (n === null) return '—';
    if (Math.abs(n) >= 1e6) return '$' + (n / 1e6).toFixed(2) + 'M';
    if (Math.abs(n) >= 1e3) return '$' + (n / 1e3).toFixed(1) + 'K';
    return '$' + n.toLocaleString('en-US', { maximumFractionDigits: 0 });
  };
  const shortDate = (s) => {
    if (!s) return '—';
    const d = new Date(s);
    if (isNaN(d)) return esc(String(s).slice(0, 10));
    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
  };
  const timeOf = (s) => {
    const d = new Date(s);
    if (isNaN(d)) return '—';
    return d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }).replace(' ', '').toLowerCase();
  };
  const dayLabel = (s) => {
    const d = new Date(s);
    if (isNaN(d)) return 'Upcoming';
    const today = new Date(); today.setHours(0,0,0,0);
    const that = new Date(d); that.setHours(0,0,0,0);
    const diff = Math.round((that - today) / 86400000);
    if (diff === 0) return 'Today';
    if (diff === 1) return 'Tomorrow';
    return d.toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' });
  };

  // ── panel renderers (each receives envelope.data, already non-null) ─
  const R = {};

  R.briefing = (d) => {
    const actions = arr(d.actions).map((a, i) => {
      const p = num(a.priority) ?? (i + 1);
      const cls = p === 1 ? 'p1' : p === 2 ? 'p2' : '';
      const chips = arr(a.sources).map((s) => `<span class="chip">${esc(s)}</span>`).join('');
      return `<div class="action ${cls}">
        <div class="action-top"><span class="pnum">P${p}</span><span class="action-title">${esc(a.title)}</span></div>
        <div class="action-why">${esc(a.why)}${a.due ? ` <strong>Due: ${esc(a.due)}.</strong>` : ''}</div>
        <div class="chips">${chips}</div>
      </div>`;
    }).join('');
    const watch = arr(d.watchlist).length
      ? `<div class="watchlist"><div class="wl-label">Watchlist</div><ul>` +
        arr(d.watchlist).map((w) => `<li>${esc(w)}</li>`).join('') + `</ul></div>`
      : '';
    return `<div class="brief-headline">${esc(d.headline)}</div>
      <div class="brief-summary">${esc(d.summary)}</div>
      <div class="actions">${actions}</div>${watch}`;
  };

  R.calendar = (d) => {
    const evs = arr(d.events);
    if (!evs.length) return `<div class="offline-body"><div class="why">No events in range.</div></div>`;
    let html = '<div class="rows">', lastDay = null;
    for (const e of evs.slice(0, 14)) {
      const dl = dayLabel(e.start);
      if (dl !== lastDay) { html += `<div class="day-label">${esc(dl)}</div>`; lastDay = dl; }
      html += `<div class="row">
        <span class="when">${timeOf(e.start)}</span>
        <div class="main"><div class="t">${esc(e.title)}</div></div>
        ${num(e.attendees) ? `<span class="end">${e.attendees} ppl</span>` : ''}
      </div>`;
    }
    return html + '</div>';
  };

  R.gmail = (d) => {
    const ts = arr(d.threads);
    if (!ts.length) return `<div class="offline-body"><div class="why">Inbox is clear.</div></div>`;
    return '<div class="rows">' + ts.slice(0, 10).map((t) => `
      <div class="row">
        <div class="main">
          <div class="t">${esc(t.subject)}</div>
          <div class="d">${esc(t.from)}${t.snippet ? ' — ' + esc(t.snippet) : ''}</div>
        </div>
        ${t.needs_action ? '<span class="flag act">Action</span>' : ''}
        <span class="end">${shortDate(t.date)}</span>
      </div>`).join('') + '</div>';
  };

  R.tactiq = (d) => {
    const ms = arr(d.meetings);
    if (!ms.length) return `<div class="offline-body"><div class="why">No recent meetings.</div></div>`;
    return '<div class="rows">' + ms.slice(0, 6).map((m) => {
      const items = arr(m.action_items).slice(0, 5)
        .map((a) => `<div class="d wrap">▸ ${esc(a)}</div>`).join('');
      return `<div class="row">
        <span class="when">${shortDate(m.date)}</span>
        <div class="main">
          <div class="t">${esc(m.title)}</div>
          ${m.summary ? `<div class="d wrap">${esc(m.summary)}</div>` : ''}
          ${items}
        </div>
      </div>`;
    }).join('') + '</div>';
  };

  R.snitcher = (d) => {
    const orgs = arr(d.organisations);
    if (!orgs.length) return `<div class="offline-body"><div class="why">No identified visitors in range.</div></div>`;
    const max = Math.max(1, ...orgs.map((o) => num(o.pageviews) ?? num(o.sessions) ?? 0));
    return '<div class="rows">' + orgs.slice(0, 9).map((o) => {
      const v = num(o.pageviews) ?? num(o.sessions) ?? 0;
      const signals = arr(o.signals).slice(0, 2).join(' · ');
      return `<div class="row">
        <div class="main">
          <div class="t">${esc(o.name)}</div>
          <div class="d">${esc([o.industry, signals].filter(Boolean).join(' — '))}</div>
        </div>
        <div style="flex:none;width:110px" title="${v} pageviews">
          <div class="bar-track"><div class="bar-fill" style="width:${Math.max(3, Math.round(v / max * 100))}%"></div></div>
        </div>
        <span class="end">${shortDate(o.last_visit)}</span>
      </div>`;
    }).join('') + '</div>';
  };

  R.hubspot = (d) => {
    const deals = arr(d.deals);
    const kpis = `<div class="kpis">
      <div class="kpi"><div class="v">${num(d.open_deal_count) ?? deals.length}</div><div class="k">Open deals</div></div>
      <div class="kpi"><div class="v good">${money(d.pipeline_value)}</div><div class="k">Pipeline value</div></div>
    </div>`;
    if (!deals.length) return kpis + `<div class="offline-body"><div class="why">No open deals returned.</div></div>`;
    const max = Math.max(1, ...deals.map((x) => num(x.amount) ?? 0));
    const rows = deals.slice(0, 10).map((x) => `
      <div class="bar-row" title="${esc(x.stage)}">
        <span class="bl">${esc(x.name)}</span>
        <div class="bar-track"><div class="bar-fill" style="width:${Math.max(3, Math.round((num(x.amount) ?? 0) / max * 100))}%"></div></div>
        <span class="bv">${money(x.amount)}</span>
      </div>
      <div class="d" style="font-size:10.5px;color:var(--muted);margin:-3px 0 4px 2px">${esc(x.stage)}${x.close_date ? ' · closes ' + shortDate(x.close_date) : ''}</div>`).join('');
    return kpis + rows;
  };

  R.quickbooks = (d) => {
    let html = '';
    const p = d.pnl;
    if (p && typeof p === 'object') {
      const net = num(p.net);
      html += `<div class="kpis">
        <div class="kpi"><div class="v">${money(p.income)}</div><div class="k">Income · ${esc(p.period || '')}</div></div>
        <div class="kpi"><div class="v">${money(p.expenses)}</div><div class="k">Expenses</div></div>
        <div class="kpi"><div class="v ${net === null ? '' : net >= 0 ? 'good' : 'crit'}">${money(p.net)}</div><div class="k">Net</div></div>
      </div>`;
    }
    const ar = d.ar_aging;
    if (ar && typeof ar === 'object') {
      const buckets = [
        ['Current', ar.current, ''], ['1–30 d', ar.d1_30, ''], ['31–60 d', ar.d31_60, 'warn'],
        ['61–90 d', ar.d61_90, 'warn'], ['90+ d', ar.d90_plus, 'crit'],
      ];
      const max = Math.max(1, ...buckets.map(([, v]) => num(v) ?? 0));
      html += `<div class="day-label">Receivables aging · total ${money(ar.total)}</div>` +
        buckets.map(([l, v, cls]) => `
          <div class="bar-row">
            <span class="bl">${l}</span>
            <div class="bar-track"><div class="bar-fill ${cls}" style="width:${Math.max(2, Math.round((num(v) ?? 0) / max * 100))}%"></div></div>
            <span class="bv">${money(v)}</span>
          </div>`).join('');
    }
    const inv = arr(d.invoices);
    if (inv.length) {
      html += `<div class="day-label" style="margin-top:12px">Open invoices</div><div class="rows">` +
        inv.slice(0, 6).map((i) => `
          <div class="row">
            <div class="main"><div class="t">${esc(i.customer)}</div><div class="d">${esc(i.status)}${i.due ? ' · due ' + shortDate(i.due) : ''}</div></div>
            <span class="end">${money(i.amount)}</span>
          </div>`).join('') + '</div>';
    }
    return html || `<div class="offline-body"><div class="why">No finance figures returned.</div></div>`;
  };

  R.apollo = (d) => {
    let html = '';
    const tasks = arr(d.tasks);
    if (tasks.length) {
      html += '<div class="rows">' + tasks.slice(0, 8).map((t) => `
        <div class="row">
          <div class="main"><div class="t">${esc(t.title)}</div>
          <div class="d">${esc([t.contact, t.company].filter(Boolean).join(' · '))}</div></div>
          <span class="end">${shortDate(t.due)}</span>
        </div>`).join('') + '</div>';
    }
    const camps = arr(d.campaigns);
    if (camps.length) {
      html += `<div class="day-label" style="margin-top:10px">Sequences</div><div class="chips">` +
        camps.slice(0, 6).map((c) => `<span class="chip">${esc(c.name)}</span>`).join('') + '</div>';
    }
    return html || `<div class="offline-body"><div class="why">No outbound tasks returned.</div></div>`;
  };

  R.drive = (d) => {
    const fs = arr(d.files);
    if (!fs.length) return `<div class="offline-body"><div class="why">No recent files.</div></div>`;
    return '<div class="rows">' + fs.slice(0, 9).map((f) => `
      <div class="row">
        <div class="main">
          <div class="t">${f.link ? `<a href="${esc(f.link)}" target="_blank" rel="noopener">${esc(f.name)}</a>` : esc(f.name)}</div>
          <div class="d">${esc([f.type, f.modified_by].filter(Boolean).join(' · '))}</div>
        </div>
        <span class="end">${shortDate(f.modified)}</span>
      </div>`).join('') + '</div>';
  };

  // ── layout spans per source ─────────────────────────────────────────
  const SPAN = { briefing: 'span-12', calendar: 'span-4', gmail: 'span-8', tactiq: 'span-6',
                 snitcher: 'span-6', hubspot: 'span-6', quickbooks: 'span-6', apollo: 'span-4', drive: 'span-8' };
  const ORDER = ['briefing', 'calendar', 'gmail', 'tactiq', 'snitcher', 'hubspot', 'quickbooks', 'apollo', 'drive'];

  function panelHTML(env) {
    const on = env.status === 'online';
    let body;
    if (on) {
      try {
        body = (R[env.source] || (() => ''))(env.data || {});
        if (!body) body = `<div class="offline-body"><div class="why">Renderer returned nothing.</div></div>`;
      } catch (e) {
        body = `<div class="offline-body"><div class="big">RENDER ERROR</div><div class="why">${esc(e.message)}</div></div>`;
      }
    } else {
      body = `<div class="offline-body">
        <div class="big">SOURCE OFFLINE</div>
        <div class="why">${esc(env.error || 'No data available.')}</div>
      </div>`;
    }
    return `<section class="panel ${SPAN[env.source] || 'span-4'}" data-panel="${esc(env.source)}">
      <div class="panel-head">
        <h2>${esc(env.label)}</h2><span class="src">${esc(env.source)}</span>
        <span class="status ${on ? 'on' : 'off'}"><span class="dot ${on ? 'on' : 'off'}"></span>${on ? 'Live' : 'Offline'}</span>
      </div>
      ${body}
    </section>`;
  }

  // ── boot ────────────────────────────────────────────────────────────
  const board = document.getElementById('board');
  document.getElementById('hdr-date').textContent =
    new Date().toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

  const MC = window.MISSION_CONTROL;
  if (!MC || typeof MC !== 'object' || !MC.sources) {
    board.innerHTML = '';
    document.querySelector('.wrap').insertAdjacentHTML('beforeend', `
      <div class="fatal">
        <h2>NO DATA LOADED</h2>
        <p>Could not read <code>data/dashboard-data.js</code>.</p>
        <p style="margin-top:10px">Run <code>node scripts/build-data.js</code> (or the <code>refresh-dashboard</code> skill) and reload.</p>
      </div>`);
    document.getElementById('status-strip').style.display = 'none';
    return;
  }

  const gen = MC.generated_at ? new Date(MC.generated_at) : null;
  document.getElementById('hdr-gen').textContent = gen && !isNaN(gen)
    ? 'data refreshed ' + gen.toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' })
    : '';

  const envs = ORDER.map((k) => MC.sources[k]).filter(Boolean);
  const onCount = envs.filter((e) => e.status === 'online').length;
  document.getElementById('hdr-sources').innerHTML =
    `<span class="dot ${onCount ? 'on' : 'off'}"></span><span>${onCount}/${envs.length} sources live</span>`;

  board.innerHTML = envs.map(panelHTML).join('');

  document.getElementById('status-strip').innerHTML =
    `<span class="strip-label">Source telemetry</span>` +
    envs.map((e) => `<span class="status-item">
      <span class="dot ${e.status === 'online' ? 'on' : 'off'}"></span>${esc(e.source)}
      <span class="fetched">${e.fetched_at ? shortDate(e.fetched_at) + ' ' + timeOf(e.fetched_at) : 'never'}</span>
    </span>`).join('');
})();
</script>
</body>
</html>
